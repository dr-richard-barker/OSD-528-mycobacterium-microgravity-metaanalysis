<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <text x="50" y="45" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0A3663">Figure 3 | Weighted Gene Co-Expression Network Analysis (WGCNA)</text>
  <text x="50" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Topological module identification and trait correlations linking co-expression circuits to physical unweighting</text>

  <!-- Panel A: Dendrogram & Color Bars -->
  <rect x="50" y="95" width="600" height="660" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="70" y="125" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">A | Hierarchical Co-Expression Clustering Dendrogram (TOM)</text>
  
  <!-- Dendrogram Tree Lines -->
  <path d="M 100 280 L 100 200 L 220 200 L 220 280" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 160 200 L 160 160 L 400 160 L 400 280" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 280 160 L 280 140 L 520 140 L 520 280" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 120 280 L 120 230 L 180 230 L 180 280" fill="none" stroke="#334155" stroke-width="1.2"/>
  <path d="M 320 280 L 320 210 L 460 210 L 460 280" fill="none" stroke="#334155" stroke-width="1.2"/>
  <path d="M 480 280 L 480 180 L 580 180 L 580 280" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Module Color Ribbon Below Tree -->
  <rect x="80" y="300" width="100" height="25" fill="#06B6D4"/>
  <text x="130" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEturquoise</text>
  <rect x="180" y="300" width="100" height="25" fill="#3B82F6"/>
  <text x="230" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEblue</text>
  <rect x="280" y="300" width="110" height="25" fill="#92400E"/>
  <text x="335" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEbrown</text>
  <rect x="390" y="300" width="110" height="25" fill="#EAB308"/>
  <text x="445" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEyellow</text>
  <rect x="500" y="300" width="100" height="25" fill="#22C55E"/>
  <text x="550" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEgreen</text>

  <!-- Module Function Annotations -->
  <rect x="80" y="345" width="530" height="380" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="100" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0891B2">■ MEturquoise (Biofilm Formation &amp; Surface Adhesion):</text>
  <text x="115" y="395" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Hubs: mps1 (kin=11.8), mps2, fmt, fadD28, groEL1. Drives PDMS colonization.</text>

  <text x="100" y="435" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563EB">■ MEblue (Mycolic Acid &amp; Cell Envelope Remodeling):</text>
  <text x="115" y="455" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Hubs: kasA (kin=15.2), kasB, acpM, inhA, fbpA (Ag85A), mmpL3.</text>

  <text x="100" y="495" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400E">■ MEbrown (Type VII ESX Secretion System):</text>
  <text x="115" y="515" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Hubs: esxA (ESAT-6, kin=24.1), esxB (CFP-10), eccA1-eccE1 core complex.</text>

  <text x="100" y="555" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#CA8A04">■ MEyellow (DosR Hypoxia Regulon &amp; Antioxidant Defense):</text>
  <text x="115" y="575" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Hubs: dosR, dosS, hspX (kin=18.4), tgs1, katG, sodA, sigH.</text>

  <text x="100" y="615" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16A34A">■ MEgreen (Simulator-Specific Shear &amp; Metabolic Divergence):</text>
  <text x="115" y="635" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Hubs: dnaK, clpP1 (Clinostat induced) vs. cydA, icl1 (RPM induced).</text>

  <!-- Panel B: Module-Trait Correlation Heatmap -->
  <rect x="680" y="95" width="470" height="660" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="700" y="125" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">B | Module-Trait Relationships</text>
  
  <text x="830" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Microgravity</text>
  <text x="980" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Clinostat vs. RPM</text>

  <!-- Heatmap Rows -->
  <!-- MEturquoise -->
  <rect x="710" y="190" width="90" height="60" fill="#06B6D4" opacity="0.8"/>
  <text x="755" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEturquoise</text>
  <rect x="805" y="190" width="100" height="60" fill="#EF4444" opacity="0.9"/>
  <text x="855" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">r = 0.99</text>
  <text x="855" y="235" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">(p = 5.3e-101)</text>
  <rect x="910" y="190" width="140" height="60" fill="#E2E8F0"/>
  <text x="980" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">r = 0.12 (p = 0.76)</text>

  <!-- MEblue -->
  <rect x="710" y="260" width="90" height="60" fill="#3B82F6" opacity="0.8"/>
  <text x="755" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEblue</text>
  <rect x="805" y="260" width="100" height="60" fill="#EF4444" opacity="0.85"/>
  <text x="855" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">r = 0.98</text>
  <text x="855" y="305" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">(p = 5.5e-34)</text>
  <rect x="910" y="260" width="140" height="60" fill="#E2E8F0"/>
  <text x="980" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">r = -0.16 (p = 0.68)</text>

  <!-- MEbrown -->
  <rect x="710" y="330" width="90" height="60" fill="#92400E" opacity="0.8"/>
  <text x="755" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEbrown</text>
  <rect x="805" y="330" width="100" height="60" fill="#EF4444" opacity="0.88"/>
  <text x="855" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">r = 0.98</text>
  <text x="855" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">(p = 7.9e-45)</text>
  <rect x="910" y="330" width="140" height="60" fill="#E2E8F0"/>
  <text x="980" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">r = 0.04 (p = 0.91)</text>

  <!-- MEyellow -->
  <rect x="710" y="400" width="90" height="60" fill="#EAB308" opacity="0.8"/>
  <text x="755" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEyellow</text>
  <rect x="805" y="400" width="100" height="60" fill="#EF4444" opacity="0.95"/>
  <text x="855" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">r = 0.99</text>
  <text x="855" y="445" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">(p = 9.7e-144)</text>
  <rect x="910" y="400" width="140" height="60" fill="#E2E8F0"/>
  <text x="980" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">r = 0.10 (p = 0.79)</text>

  <!-- MEgreen -->
  <rect x="710" y="470" width="90" height="60" fill="#22C55E" opacity="0.8"/>
  <text x="755" y="505" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MEgreen</text>
  <rect x="805" y="470" width="100" height="60" fill="#EF4444" opacity="0.88"/>
  <text x="855" y="498" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">r = 0.98</text>
  <text x="855" y="515" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">(p = 1.4e-43)</text>
  <rect x="910" y="470" width="140" height="60" fill="#E2E8F0"/>
  <text x="980" y="505" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">r = -0.01 (p = 0.97)</text>

  <rect x="710" y="550" width="410" height="150" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="730" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Key Scientific Takeaway:</text>
  <text x="730" y="600" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A8A">• 3D Clinostat &amp; RPM 2.0 induce highly uniform core microgravity</text>
  <text x="730" y="618" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A8A">  reprogramming across cell wall, biofilm, and virulence networks (r &gt; 0.97).</text>
  <text x="730" y="640" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A8A">• Differential simulator mechanics manifest predominantly in</text>
  <text x="730" y="658" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A8A">  discrete chaperone and respiratory markers rather than global state.</text>
</svg>
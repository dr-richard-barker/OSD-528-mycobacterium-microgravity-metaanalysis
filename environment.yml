# Conda environment for the core pipeline. Versions are those used for the October 2026 run.
# The classification step (04) uses requirements-ml.txt in a separate virtualenv (make ml-env).
name: osd528-reanalysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - numpy=2.0.2
  - pandas=2.3.3
  - scipy=1.13.1
  - matplotlib=3.9.4
  - requests=2.32.5
  - kallisto=0.52.0
  - r-base=4.6
  - bioconductor-deseq2=1.52.0
  - bioconductor-apeglm=1.34.0
  - r-wgcna=1.74
  - r-jsonlite=2.0.0
  - pandoc=3.10.2
